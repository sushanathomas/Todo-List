<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="Todolist.css">
</head>

<body>
    <main>
        <h1> Todo-List</h1>
        <!-- This form is where the user enters a new task. -->
        <section id="listForm">
            <input type="text" id="taskInput" placeholder="Enter tasks">
            <button type="button" id="submitTask">Submit Tasks</button>
            <!-- Submit button once tasks are entered -->
        </section>
        <ul id="taskList">
        </ul>
        <!-- Delete/clear tasks from list once completed -->
        <button id="deleteBtn">
            Delete Tasks
        </button>
        <p></p>
    </main>

    <script src="TodoList.js"></script>
</body>

</html>
